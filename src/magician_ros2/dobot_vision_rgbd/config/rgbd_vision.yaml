object_fusion_node:
  ros__parameters:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info
    detections_topic: /dobot_vision/detections
    status_topic: /dobot_vision/status
    max_sync_delta_ms: 100.0
    sync_queue_size: 10
    depth_scale_16uc1_to_mm: 1.0
    minimum_frame_depth_valid_ratio: 0.05
    processing_fps: 10.0
    require_registered_depth: true
    shape_rules_path: ''
    color_rules_path: ''
    object_classes_path: ''
    debug_enabled: false
    visualization_enabled: true
    annotated_output_path: /tmp/dobot_rgbd_annotated.jpg
    dry_run: true
    allow_real_motion: false
