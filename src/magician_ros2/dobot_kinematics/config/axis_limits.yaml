# Joint ranges cross-checked against DOBOT's Magician specification, 2026-11-02:
# https://www.dobot-robots.com/products/education/magician.html
# Manufacturer reach/joint limits do not define surveyed obstacle-free volume.
/dobot_trajectory_validation_server:
  ros__parameters:
    axis_1_range: [-120, 120]
    axis_2_range: [-5, 90]
    axis_3_range: [-15, 90]
    axis_4_range: [-140, 140]
    enable_collision_check: true
    detect_ground_collision: true
    collision_step_mm: 2.0
    collision_joint_step_deg: 2.0
