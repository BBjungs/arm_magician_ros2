visual_servo:
  mode: eye_in_hand
  calibration_required: false
  controller: adaptive_ibvs
  target_class: black_cap
  xy_tolerance_px: 8
  initial_probe_mm: 1.0
  max_step_mm: 3.0
  velocity_ratio: 0.10
  acceleration_ratio: 0.10
  target_timeout_sec: 1.0
  max_iterations: 80
  require_fresh_rgbd: true
  require_robot_feedback: true
  require_trajectory_validation: true
  require_operator_enable: true
  stop_on_target_loss: true
  stop_depth_mm: 200.0
  depth_tolerance_mm: 2.0
  stationary_samples: 3
  minimum_confidence: 0.70
  damping: 0.15
  gain: 0.6
  min_response: 0.15
  max_condition: 80.0
  max_travel_mm: 100.0
  feedback_timeout_sec: 0.5
  motion_timeout_sec: 10.0
  max_sync_delta_sec: 0.08
  track_gate_px: 40.0
  enable_timeout_sec: 60.0
  # Commission these measured bounds before ENABLE. Not a hand-eye transform.
  # Entire swept assembly must remain in this surveyed obstacle-free box.
  free_volume_min_mm: []
  free_volume_max_mm: []
  assembly_radius_mm: 0.0
  clearance_mm: 10.0
  geometry_confirmed: false
