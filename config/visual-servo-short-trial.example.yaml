# Template only. No hardware experiment has been authorized or performed.
# One validated +X probe, then SAFE_STOP at the iteration/travel budget.
visual_servo:
  mode: eye_in_hand
  calibration_required: false
  controller: adaptive_ibvs
  target_class: black_cap
  xy_tolerance_px: 8
  initial_probe_mm: 1.0
  max_step_mm: 1.0
  velocity_ratio: 0.10
  acceleration_ratio: 0.10
  target_timeout_sec: 1.0
  max_iterations: 1
  max_travel_mm: 1.0
  require_fresh_rgbd: true
  require_robot_feedback: true
  require_trajectory_validation: true
  require_operator_enable: true
  stop_on_target_loss: true
  stop_depth_mm: 200.0
  # Replace only with measured, operator-confirmed values in robot base mm.
  free_volume_min_mm: []
  free_volume_max_mm: []
  assembly_radius_mm: 0.0
  clearance_mm: 10.0
  geometry_confirmed: false
