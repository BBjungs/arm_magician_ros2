/**:
  ros__parameters:
    calibration_bundle_path: ~/.ros/dobot/markerless_calibration.npz
    camera_compressed_topic: /camera/color/image_raw/compressed
    camera_device: ''
    camera_fps: 30.0
    camera_height: 480
    camera_info_topic: /camera/color/camera_info
    camera_raw_topic: /camera/color/image_raw
    camera_width: 640
    enable_camera_preview: true
    fallback_tcp_pose_topic: ''
    host: 0.0.0.0
    observation_pose_mm: !!python/tuple
    - 220.0
    - 0.0
    - 80.0
    - 0.0
    port: 8080
    require_integrated_startup: true
    startup_auto: true
    startup_auto_motion: false
    stream_fps: 12.0
    tcp_pose_topic: dobot_pose_raw
    tool_mapping: canonical
    vision_annotated_path: /tmp/dobot_rgbd_annotated.jpg
    vision_engine: rgbd_shape
    vision_mode: eye_in_hand
