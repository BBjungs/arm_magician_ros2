    reported_tcp_to_suction_tcp_mm: [0.0, 0.0, -70.0]
    suction_tcp_to_camera_reference_mm: [50.0, 0.0, 35.0]
    tool_to_camera_reference_mm: [50.0, 0.0, -35.0]
    translation_error_bound_mm: 1.0
    envelope_radius_mm: 152.6
    radius_derivation_components_mm: {x: 130.0, z: 80.0}
    components_are_certified_signed_axis_extrema: false
    note: ใช้ข้อมูลที่ผู้ควบคุมส่งไว้แล้ว ไม่ขอวัดซ้ำ; องค์ประกอบรัศมีไม่ได้ระบุ min/max ของทุกชิ้นส่วน
  calculated_volume_requirement:
    status: DESIGN_REQUIREMENT_NOT_MEASURED_NOT_AUTHORIZED
