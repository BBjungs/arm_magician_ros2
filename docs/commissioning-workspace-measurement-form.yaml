# แบบบันทึกหน้างาน ไม่ใช่ไฟล์ configuration ที่ได้รับอนุญาต
# กรอกหน่วยเมตร เว้น null หากยังไม่มีหลักฐาน; ใช้แบบโรงงานได้เมื่อ datum และการติดตั้งตรงกัน
schema_version: 1
installation_verified: false
whole_robot_environment_verified: false
measurement_source: caretaker_confirmation_in_conversation_pending_method_and_geometry_review
base_frame: magician_base_link
camera_id: null
mount_fingerprint: null
table_surface_z_m: -0.058  # ผู้ควบคุมยืนยันค่า signed Z; ยังต้องเทียบ datum กับ magician_base_link
free_volume_min_m: [0.170, -0.070, 0.050]  # ผู้ใช้ส่งล่าสุด; ยังไม่ยืนยันว่าเป็น TCP range หรือ whole-environment volume
free_volume_max_m: [0.230, 0.070, 0.120]
minimum_clearance_m: 0.025  # safety policy เดิม ไม่ใช่ค่าที่วัด

# ส่วนหลักฐานเพิ่มเติม; loader เดิมอ่านเฉพาะ field workspace ด้านบน
measurement_record:
  reused_mount_measurements:
