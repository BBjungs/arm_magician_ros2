    authorization_bound_to_validated_plan: false
    path_validation_requested: true
    superseded_table_surface_z_m: 0.0
    camera_and_suction_tool_no_collision_along_path_confirmed: true
    camera_and_suction_tool_statement_source: conversation_user_confirmation
    free_volume_values_reported_as_actual: false
    latest_calculated_dimensions_confirmed_correct_by_caretaker: true
    free_volume_statement_source: conversation_user_resubmitted_xyz_bounds_after_geometry_audit
    free_volume_current_status: OPERATOR_REPORTED_BOUNDS_PENDING_SCOPE_RECONCILIATION
    latest_reported_min_mm: [170, -70, 50]
    latest_reported_max_mm: [230, 70, 120]
    superseded_calculated_free_volume_min_m: [-0.0086, -0.2486, 0.0014]
    superseded_calculated_free_volume_max_m: [0.4086, 0.2486, 0.3986]
